<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Kumud Ranjan — Full-Stack Engineer, AI Systems, Automation">
  <title>Kumud Ranjan — Full-Stack Engineer · AI Systems · Automation</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#090806"/>
      <stop offset="50%"  stop-color="#14100A"/>
      <stop offset="100%" stop-color="#090806"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#C9A24B" stop-opacity=".30"/>
      <stop offset="60%"  stop-color="#C9A24B" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>

    <!-- Sweeping gold: the highlight stop travels across the fill forever -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A5E1E"/>
      <stop offset="40%"  stop-color="#C9A24B"/>
      <stop offset="50%"  stop-color="#FFF6DC"/>
      <stop offset="60%"  stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#7A5E1E"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C9A24B" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#E8C874" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFade"><rect width="1000" height="300" fill="url(#fade)"/></mask>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, Consolas, monospace; }

    /* Name strokes draw themselves on, then the gold fill rises underneath */
    .draw  { fill: none; stroke: #E8C874; stroke-width: 1.1; stroke-linejoin: round;
             stroke-dasharray: 2400; stroke-dashoffset: 2400;
             animation: draw 2.6s cubic-bezier(.6,.05,.2,1) .25s forwards; }
    .fill  { fill: url(#gold); opacity: 0; animation: rise 1.5s ease 1.9s forwards; }
    .halo  { fill: #C9A24B; opacity: 0; filter: url(#soft);
             animation: halo 4.5s ease-in-out 2.4s infinite; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @keyframes halo { 0%,100% { opacity: .10; } 50% { opacity: .30; } }

    /* Sub-line reveals like a wipe, not a fade */
    .wipe  { animation: wipe 1.3s cubic-bezier(.6,.05,.2,1) 2.5s forwards; }
    @keyframes wipe { to { width: 1000px; } }

    .ruleIn { transform-origin: 500px 196px; transform: scaleX(0);
              animation: ruleIn 1.4s cubic-bezier(.6,.05,.2,1) 2.1s forwards; }
    @keyframes ruleIn { to { transform: scaleX(1); } }

    /* Corner brackets snap in last */
    .brk { stroke: #C9A24B; stroke-width: 1.4; fill: none; opacity: 0;
           stroke-dasharray: 90; stroke-dashoffset: 90;
           animation: brk 1s ease 3.1s forwards; }
    @keyframes brk { to { opacity: .75; stroke-dashoffset: 0; } }

    /* Drifting motes */
    .mote { fill: #E8C874; animation: drift linear infinite; }
    @keyframes drift {
      0%   { opacity: 0;   transform: translateY(14px); }
      15%  { opacity: .55; }
      85%  { opacity: .35; }
      100% { opacity: 0;   transform: translateY(-46px); }
    }

    .scan { animation: scan 9s linear infinite; }
    @keyframes scan { from { transform: translateX(-260px);} to { transform: translateX(1260px);} }

    .grid { animation: gridslide 22s linear infinite; }
    @keyframes gridslide { from { transform: translateX(0);} to { transform: translateX(60px);} }

    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0; animation: none; }
      .fill { opacity: 1; animation: none; }
      .wipe { width: 1000px; animation: none; }
      .ruleIn { transform: scaleX(1); animation: none; }
      .brk  { opacity: .75; stroke-dashoffset: 0; animation: none; }
      .halo, .mote, .scan, .grid { animation: none; }
    }
  </style>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- Perspective grid, slowly sliding -->
  <g mask="url(#edgeFade)" opacity=".16">
    <g class="grid">
      <g stroke="#C9A24B" stroke-width=".5">
        <path d="M-60 0V300M0 0V300M60 0V300M120 0V300M180 0V300M240 0V300M300 0V300M360 0V300M420 0V300M480 0V300M540 0V300M600 0V300M660 0V300M720 0V300M780 0V300M840 0V300M900 0V300M960 0V300M1020 0V300"/>
      </g>
    </g>
    <g stroke="#C9A24B" stroke-width=".5">
      <path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000"/>
    </g>
  </g>

  <ellipse cx="500" cy="150" rx="430" ry="130" fill="url(#glow)"/>

  <!-- Drifting motes -->
  <g mask="url(#edgeFade)">
    <circle class="mote" cx="120" cy="250" r="1.6" style="animation-duration:7s;  animation-delay:0s"/>
    <circle class="mote" cx="255" cy="270" r="1.2" style="animation-duration:9s;  animation-delay:1.4s"/>
    <circle class="mote" cx="390" cy="255" r="1.8" style="animation-duration:8s;  animation-delay:2.6s"/>
    <circle class="mote" cx="610" cy="268" r="1.3" style="animation-duration:10s; animation-delay:.8s"/>
    <circle class="mote" cx="745" cy="252" r="1.7" style="animation-duration:7.5s;animation-delay:3.2s"/>
    <circle class="mote" cx="880" cy="272" r="1.2" style="animation-duration:9.5s;animation-delay:2s"/>
    <circle class="mote" cx="185" cy="262" r="1.1" style="animation-duration:11s; animation-delay:4.1s"/>
    <circle class="mote" cx="820" cy="258" r="1.4" style="animation-duration:8.5s;animation-delay:5.3s"/>
  </g>

  <!-- Name: drawn, then filled, with a breathing halo behind -->
  <g text-anchor="middle">
    <text class="mono halo" x="500" y="150" font-size="70" font-weight="700" letter-spacing="9">KUMUD RANJAN</text>
    <text class="mono fill" x="500" y="150" font-size="70" font-weight="700" letter-spacing="9">KUMUD RANJAN</text>
    <text class="mono draw" x="500" y="150" font-size="70" font-weight="700" letter-spacing="9">KUMUD RANJAN</text>
  </g>

  <!-- Expanding hairline -->
  <rect class="ruleIn" x="230" y="195" width="540" height="1.5" fill="url(#rule)"/>

  <!-- Role line, revealed by a wipe -->
  <g>
    <clipPath id="clipRole"><rect class="wipe" x="0" y="205" width="0" height="60"/></clipPath>
    <g clip-path="url(#clipRole)">
      <text class="mono" x="500" y="232" text-anchor="middle" font-size="16.5" letter-spacing="5.5" fill="#D6C9A8">
        FULL-STACK ENGINEER
        <tspan fill="#8A7A5C"> · </tspan>AI SYSTEMS<tspan fill="#8A7A5C"> · </tspan>AUTOMATION
      </text>
    </g>
  </g>

  <!-- Light sweep across the whole plate -->
  <g mask="url(#edgeFade)" opacity=".16">
    <rect class="scan" x="0" y="0" width="120" height="300" fill="url(#rule)" transform="skewX(-14)"/>
  </g>

  <!-- Corner brackets -->
  <g class="brk"><path d="M28 40V22h26"/></g>
  <g class="brk" style="animation-delay:3.25s"><path d="M972 40V22h-26"/></g>
  <g class="brk" style="animation-delay:3.4s"><path d="M28 260v18h26"/></g>
  <g class="brk" style="animation-delay:3.55s"><path d="M972 260v18h-26"/></g>
</svg>
