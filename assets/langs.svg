<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Top Languages — TypeScript 79.0%, Python 15.2%, JavaScript 4.3%, CSS 0.8%, HTML 0.6%, Shell 0.1%">
  <title>Top Languages — TypeScript 79.0%, Python 15.2%, JavaScript 4.3%, CSS 0.8%, HTML 0.6%, Shell 0.1%</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0C08"/><stop offset="100%" stop-color="#15110B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#C9A24B" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="28" y="66" width="424" height="16" rx="8"/></clipPath>
    <clipPath id="wipeclip"><rect class="wipe" x="28" y="60" width="0" height="30"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","SF Mono","Fira Code",ui-monospace,Consolas,monospace; }
    .lbl { font-size: 10.5px; letter-spacing: 1.4px; fill: #8A7A5C; }
    .val { font-size: 24px; font-weight: 700; fill: #E8C874; }
    .hdr { font-size: 12px; letter-spacing: 2.6px; fill: #C9A24B; }
    .nm  { font-size: 11.5px; fill: #D6C9A8; }
    .pc  { font-size: 11.5px; fill: #8A7A5C; }
    .item, .leg { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes pop { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    .ruleIn { transform-origin: 0 0; transform: scaleX(0); animation: rin 1s ease .1s forwards; }
    @keyframes rin { to { transform: scaleX(1); } }
    .wipe { animation: fill 1.5s cubic-bezier(.55,.05,.2,1) .25s forwards; }
    @keyframes fill { to { width: 424px; } }
    .spark, .dot { animation: glow 3.8s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:.4} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .item,.leg { opacity:1; animation:none; }
      .ruleIn { transform: scaleX(1); animation:none; }
      .wipe { width: 424px; animation:none; }
      .spark,.dot { animation:none; }
    }
  </style>
  <rect x=".8" y=".8" width="478.4" height="218.4" rx="11" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/>
  <text class="mono hdr" x="28" y="36">◢ TOP LANGUAGES</text>
  <rect class="ruleIn" x="28" y="46" width="424" height="1.2" fill="url(#rule)"/>
  <rect x="28" y="66" width="424" height="16" rx="8" fill="#241D12"/>
  <g clip-path="url(#wipeclip)"><g clip-path="url(#barclip)">
    <rect x="28.0" y="66" width="334.9" height="16" fill="#3178c6"/>
    <rect x="362.9" y="66" width="64.6" height="16" fill="#3572A5"/>
    <rect x="427.5" y="66" width="18.0" height="16" fill="#f1e05a"/>
    <rect x="445.5" y="66" width="3.5" height="16" fill="#663399"/>
    <rect x="449.0" y="66" width="2.7" height="16" fill="#e34c26"/>
    <rect x="451.7" y="66" width="0.3" height="16" fill="#89e051"/>
  </g></g>
  <g class="leg" style="animation-delay:0.90s">
    <circle class="dot" cx="34" cy="118" r="5" fill="#3178c6"/>
    <text class="mono nm" x="46" y="122">TypeScript</text>
    <text class="mono pc" x="180" y="122" text-anchor="end">79.0%</text>
  </g>
  <g class="leg" style="animation-delay:0.98s">
    <circle class="dot" cx="34" cy="148" r="5" fill="#3572A5"/>
    <text class="mono nm" x="46" y="152">Python</text>
    <text class="mono pc" x="180" y="152" text-anchor="end">15.2%</text>
  </g>
  <g class="leg" style="animation-delay:1.06s">
    <circle class="dot" cx="34" cy="178" r="5" fill="#f1e05a"/>
    <text class="mono nm" x="46" y="182">JavaScript</text>
    <text class="mono pc" x="180" y="182" text-anchor="end">4.3%</text>
  </g>
  <g class="leg" style="animation-delay:1.14s">
    <circle class="dot" cx="266" cy="118" r="5" fill="#663399"/>
    <text class="mono nm" x="278" y="122">CSS</text>
    <text class="mono pc" x="452" y="122" text-anchor="end">0.8%</text>
  </g>
  <g class="leg" style="animation-delay:1.22s">
    <circle class="dot" cx="266" cy="148" r="5" fill="#e34c26"/>
    <text class="mono nm" x="278" y="152">HTML</text>
    <text class="mono pc" x="452" y="152" text-anchor="end">0.6%</text>
  </g>
  <g class="leg" style="animation-delay:1.30s">
    <circle class="dot" cx="266" cy="178" r="5" fill="#89e051"/>
    <text class="mono nm" x="278" y="182">Shell</text>
    <text class="mono pc" x="452" y="182" text-anchor="end">0.1%</text>
  </g>
</svg>
