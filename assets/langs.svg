<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="Top Languages — Python 43.9%, TypeScript 14.7%, JavaScript 12.3%, HTML 11.7%, CSS 8.7%, Jupyter Notebook 8.6%">
  <title>Top Languages — Python 43.9%, TypeScript 14.7%, JavaScript 12.3%, HTML 11.7%, CSS 8.7%, Jupyter Notebook 8.6%</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1420"/><stop offset="100%" stop-color="#0E2438"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x=".8" y=".8" width="478.4" height="218.4" rx="11"/></clipPath>
    <clipPath id="barclip"><rect x="28" y="66" width="424" height="16" rx="8"/></clipPath>
    <clipPath id="wipeclip"><rect class="wipe" x="28" y="60" width="0" height="30"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono","SF Mono","Fira Code",ui-monospace,Consolas,monospace; }
    .lbl { font-size: 10.5px; letter-spacing: 1.4px; fill: #3E6E85; }
    .val { font-size: 24px; font-weight: 700; fill: #67E8F9; }
    .hdr { font-size: 12px; letter-spacing: 2.6px; fill: #22D3EE; }
    .nm  { font-size: 11.5px; fill: #A8D8E8; }
    .pc  { font-size: 11.5px; fill: #3E6E85; }
    .item, .leg { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes pop { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    .ruleIn { transform-origin: 0 0; transform: scaleX(0); animation: rin 1s ease .1s forwards; }
    @keyframes rin { to { transform: scaleX(1); } }
    .wipe { animation: fill 1.5s cubic-bezier(.55,.05,.2,1) .25s forwards; }
    @keyframes fill { to { width: 424px; } }
    .spark, .dot { animation: glow 3.8s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:.4} 50%{opacity:1} }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes scan { 0%{transform:translateY(-10px);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(226px);opacity:0} }
    .ring { transform-origin: 440px 32px; animation: ringspin 12s linear infinite; }
    @keyframes ringspin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .item,.leg { opacity:1; animation:none; }
      .ruleIn { transform: scaleX(1); animation:none; }
      .wipe { width: 424px; animation:none; }
      .spark,.dot,.scan,.ring { animation:none; }
    }
  </style>
  <rect x=".8" y=".8" width="478.4" height="218.4" rx="11" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/>
  <g clip-path="url(#cardclip)">
    <rect class="scan" x="0" y="0" width="480" height="2" fill="url(#scanline)"/>
  </g>
  <text class="mono hdr" x="28" y="36">◢ TOP LANGUAGES</text>
  <rect class="ruleIn" x="28" y="46" width="424" height="1.2" fill="url(#rule)"/>
  <g class="ring"><rect x="434" y="26" width="12" height="12" rx="2" fill="none" stroke="#22D3EE" stroke-opacity=".7" stroke-width="1.1"/></g>
  <rect x="28" y="66" width="424" height="16" rx="8" fill="#14283C"/>
  <g clip-path="url(#wipeclip)"><g clip-path="url(#barclip)">
    <rect x="28.0" y="66" width="186.0" height="16" fill="#3572A5"/>
    <rect x="214.0" y="66" width="62.5" height="16" fill="#3178c6"/>
    <rect x="276.5" y="66" width="52.2" height="16" fill="#f1e05a"/>
    <rect x="328.7" y="66" width="49.5" height="16" fill="#e34c26"/>
    <rect x="378.3" y="66" width="36.7" height="16" fill="#663399"/>
    <rect x="415.0" y="66" width="36.7" height="16" fill="#DA5B0B"/>
  </g></g>
  <g class="leg" style="animation-delay:0.90s">
    <circle class="dot" cx="34" cy="118" r="5" fill="#3572A5"/>
    <text class="mono nm" x="46" y="122">Python</text>
    <text class="mono pc" x="180" y="122" text-anchor="end">43.9%</text>
  </g>
  <g class="leg" style="animation-delay:0.98s">
    <circle class="dot" cx="34" cy="148" r="5" fill="#3178c6"/>
    <text class="mono nm" x="46" y="152">TypeScript</text>
    <text class="mono pc" x="180" y="152" text-anchor="end">14.7%</text>
  </g>
  <g class="leg" style="animation-delay:1.06s">
    <circle class="dot" cx="34" cy="178" r="5" fill="#f1e05a"/>
    <text class="mono nm" x="46" y="182">JavaScript</text>
    <text class="mono pc" x="180" y="182" text-anchor="end">12.3%</text>
  </g>
  <g class="leg" style="animation-delay:1.14s">
    <circle class="dot" cx="266" cy="118" r="5" fill="#e34c26"/>
    <text class="mono nm" x="278" y="122">HTML</text>
    <text class="mono pc" x="452" y="122" text-anchor="end">11.7%</text>
  </g>
  <g class="leg" style="animation-delay:1.22s">
    <circle class="dot" cx="266" cy="148" r="5" fill="#663399"/>
    <text class="mono nm" x="278" y="152">CSS</text>
    <text class="mono pc" x="452" y="152" text-anchor="end">8.7%</text>
  </g>
  <g class="leg" style="animation-delay:1.30s">
    <circle class="dot" cx="266" cy="178" r="5" fill="#DA5B0B"/>
    <text class="mono nm" x="278" y="182">Jupyter Notebook</text>
    <text class="mono pc" x="452" y="182" text-anchor="end">8.6%</text>
  </g>
</svg>
